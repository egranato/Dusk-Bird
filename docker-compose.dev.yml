# Local-dev overlay (hot reload, exposed ports). Not auto-merged — Compose
# only does that for a file literally named docker-compose.override.yml. This
# one is intentionally renamed so a plain `docker compose up -d` on the NUC
# can never pick it up by accident; local dev passes it explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  api:
    build:
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
    command: npm run start:dev
    environment:
      NODE_ENV: development

  postgres:
    ports:
      - "5432:5432"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  # Caddy is not useful locally (no real domain = no cert).
  # Disable it so it doesn't clutter the logs.
  caddy:
    profiles:
      - production
