services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: duskbird_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "3000"
    mem_limit: 512m
    cpus: "1"

  postgres:
    image: postgres:16-alpine
    container_name: duskbird_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "1"

  minio:
    image: minio/minio:latest
    container_name: duskbird_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - type: bind
        source: ${NUC_STORAGE_PATH}
        target: /data
    networks:
      - internal
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: "1"

  dnsmasq:
    image: 4km3/dnsmasq:2.85-r2
    container_name: duskbird_dnsmasq
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    cap_add:
      - NET_ADMIN
    command: -k --no-resolv --server=1.1.1.1 --server=8.8.8.8 --address=/${DOMAIN}/${NUC_LOCAL_IP}
    profiles:
      - production
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: duskbird_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
      - edge
    depends_on:
      - api
    mem_limit: 128m
    cpus: "0.5"

networks:
  internal:
    driver: bridge
  edge:
    external: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
